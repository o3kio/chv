# cargo-audit configuration for the CHV workspace.
#
# `cargo audit` (RustSec) walks Cargo.lock directly and is stricter than
# `cargo deny` — it does not perform feature/target reachability filtering,
# so it can surface advisories (e.g. `unsound`) that cargo-deny's graph walk
# never evaluates. Verified 2026-09-29: event-listener RUSTSEC-2026-0221
# (unsound) was invisible to cargo-deny but reported by cargo audit.
#
# Docs: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
# CI:   .github/workflows/security.yml (rustsec/audit-check@v2 reads this file)

[advisories]
# cargo-audit walks the raw Cargo.lock with NO reachability filtering, so its
# ignore set is NOT identical to deny.toml's: crates that are present in the
# lockfile but provably unreachable in the build graph (verified via
# `cargo deny list` / cargo-deny's feature-aware walk) still fire here and
# need an entry, with the reachability evidence documented below. Do not
# blindly mirror the two files — reconcile each against its own tool.
#
# Removed 2026-09-29 (prompt 03 reconciliation, issue #230):
#   RUSTSEC-2024-0370 (proc-macro-error 1.x) — crate left the graph entirely
#     when tabled moved off it; superseded state (proc-macro-error2) also gone.
ignore = [
    # --- Unmaintained (informational; no vulnerability) -------------------
    # Policy (deny.toml): unmaintained advisories are HARD FAILURES in both
    # cargo-deny v2 and cargo-audit. The two entries below are the only
    # accepted exceptions, each carrying the documented (a)/(b)/(c) migration
    # plan required by the ignore-list policy; deny.toml repeats the same
    # rationale so both gates agree. Neither advisory describes a defect —
    # both record upstream maintenance status.

    # RUSTSEC-2026-0543 — `chrono` is unmaintained (all versions).
    #   (a) Non-applicable as a vulnerability: chrono is used for UTC
    #       timestamps only (RFC 3339 text in SQLite, per
    #       docs/specs/cellhv-core-local-store.md). No advisory-specific
    #       exploit exists; the gate exists to force a migration.
    #   (b) Upstream: https://github.com/chronotope/chrono/issues/1768
    #       (`object_store 0.14.2` and `cron 0.17` also require chrono, so
    #       rewriting the 9 direct workspace crates would not remove it).
    #   (c) Remove when object_store drops its unconditional chrono
    #       dependency and cron/the direct users migrate to jiff/time.
    #       Tracking: #755.
    "RUSTSEC-2026-0543",

    # RUSTSEC-2026-0542 — `humantime` is unmaintained (transitively via
    # `object_store`'s duration parser; CHV has no direct use).
    #   (a) Non-applicable as a vulnerability: maintenance status only; no
    #       CHV code path calls humantime directly.
    #   (b) Upstream: https://github.com/chronotope/chrono/issues/1768
    #       (the advisory's own url field points at the chrono issue because
    #       in this timeline humantime wraps chrono; object_store 0.14.2 is
    #       the latest release and depends on humantime 2.1 unconditionally).
    #   (c) Remove when object_store stops depending on humantime.
    #       Tracking: #756.
    "RUSTSEC-2026-0542",

    # Removed 2026-10-08 (#235 PR 2 — rustls-pemfile fully retired):
    # RUSTSEC-2025-0134 no longer requires an ignore — chv-stord-core's
    # three PEM sites (src/server.rs + the migration mTLS tests) migrated
    # to rustls-pki-types' folded-in parser and the dependency was
    # dropped; the crate is absent from Cargo.lock entirely (PR 1 of
    # #235 already removed the tonic transitive edge).

    # Removed 2026-10-01 (issue #177 resolved — rust-s3 replaced by
    # object_store 0.14): RUSTSEC-2026-0194 and RUSTSEC-2026-0195 no longer
    # require exceptions — quick-xml now resolves to 0.41.0, which is outside
    # both advisories' affected ranges.
]
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "none"

[database]
# NOTE: do NOT set `path` to a `~`-relative string — path expansion is
# tool-specific (cargo-audit expands it; cargo-deny does not and creates a
# literal `./~/` tree). The default (`~/.cargo/advisory-db`) is correct.
url  = "https://github.com/rustsec/advisory-db"
fetch = true
stale = false

[output]
deny = ["warnings", "unmaintained", "unsound", "yanked"]
format = "terminal"
quiet  = false

[yanked]
enabled = true
update_index = true
