name: CI

# Version bumps are handled manually via:
#   make bump-version BUMP_TYPE=patch
# See scripts/bump-version.sh for details.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release gate entry point (#650). release.yml calls this workflow so the
  # checks that gate merges are exactly the checks that gate publication —
  # no second, drifting copy of the quality gate. A tag push does not match
  # the push/pull_request triggers above, so it only runs when called.
  workflow_call:
    inputs:
      skip_optional_checks:
        # Inside a called reusable workflow `github.event_name` is the
        # caller's event (a tag push for release.yml), so event_name cannot
        # distinguish direct PR/push runs from release gates. This explicit
        # input is the structural gate for PR-only lanes.
        description: 'Skip PR-only coverage and Real-BFF E2E lanes'
        required: false
        default: false
        type: boolean

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    # Observed 2026-10-01 (PR #348, run 36884770214): an apt mirror
    # (azure.archive.ubuntu.com) hang in the "Install protoc" step
    # starved the job until the 6-hour GitHub cap killed it — six
    # runner-hours for zero output. Normal runtime is ~6-13 min
    # (cache-cold worst case well under 45); a hang must fail fast.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (pinned 2026-09-30)

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        # --all-targets also lints tests/benches/examples. The release quality
        # gate (release.yml calls this workflow, #650) must not publish code
        # that only fails when compiled in a non-default target.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: ADR-009 println!/eprintln! ban (library crates)
        run: ./scripts/check-no-println.sh

      - name: Migration version uniqueness (per-directory)
        # Detects duplicate migration version numbers within one migrations
        # directory (independent per-directory namespaces); a duplicate
        # breaks every fresh DB boot and merge-ref CI cannot see
        # cross-PR collisions (run 8a / PR #289 renumber recurrence).
        run: ./scripts/check-migrations-unique.sh

      - name: CellHV Core architecture and compatibility guards
        run: |
          python3 -B scripts/check-cellhv-core-architecture.py
          python3 -B -m unittest tests/test_cellhv_core_architecture.py

      - name: CellHV Core packaging security-parity guards
        # Standalone-install vs .deb unit hardening parity and destructive
        # Core-path guards. Not gated before #439: the module predated PR
        # #334 but was never added to this job, so the #334 heredoc removal
        # broke it silently on main.
        run: python3 -B -m unittest tests/test_cellhv_core_packaging.py

      - name: CellHV OpenStack discovery evidence guards
        run: |
          python3 -B scripts/check-cellhv-openstack-discovery.py
          python3 -B scripts/check-cellhv-openstack-discovery.py \
            --report docs/evidence/cellhv-openstack-discovery/report.json
          python3 -B -m unittest \
            tests/test_cellhv_openstack_discovery.py \
            tests/test_openstack_discovery_lab.py
          bash -n scripts/openstack-discovery/*.sh

      - name: Prometheus alert/emitter label drift gate
        # Detects rules in monitoring/rules/*.yml that reference label keys
        # the emitter source code never produces (recurrence guard for the
        # `metric-label-drift-alert-vs-emitter` retro and PR #108 CR2).
        run: ./scripts/check-metric-labels.sh

      - name: Installer release-signature negative path
        # Offline test of scripts/install.sh's GPG verification policy (#646):
        # a tampered or missing signature must abort. Kept in CI so the
        # installer's trust checks cannot silently rot.
        run: ./tests/scripts/install-signature-negative.sh

      - name: Qualification harness config invariants
        # Offline guards for the self-hosted KVM lane (#659): the shared
        # CP→agent auth master, the per-scenario stord metrics ports, and the
        # runner-hygiene hooks. These regressed silently in #687/#693 and only
        # surfaced as a red nightly hours later.
        run: ./tests/scripts/qual-harness-invariants.sh

      - name: Install cargo-nextest
        # Nextest runs each test in its own process, isolates hangs, and
        # reports a per-test summary; it does not run doctests (see below).
        # Pin the tool version: the action otherwise installs the latest
        # release, which makes CI nondeterministic.
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-nextest@0.9.151

      - name: cargo nextest
        # `cargo test` stopped at the first failing test binary. Keep
        # --no-fail-fast so a red PR shows the full blast radius (all
        # failures, not just the first) in one run.
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo test (doctests)
        # cargo-nextest intentionally does not execute doctests. Keep them in
        # CI instead of silently losing that coverage (#659).
        run: cargo test --workspace --doc

      - name: Build chv-agent process smoke binary
        run: cargo build --package chv-agent

      - name: Test core-native chv-agent process lifecycle
        timeout-minutes: 2
        run: python3 -B scripts/integration/core-native-agent-smoke.py --binary target/debug/chv-agent

      - name: Build chv-controlplane process smoke binary
        run: cargo build --package chv-controlplane

      - name: Test fail-closed security startup (controlplane + agent)
        timeout-minutes: 2
        run: python3 -B scripts/integration/security-startup-smoke.py --controlplane target/debug/chv-controlplane --agent target/debug/chv-agent

      - name: Verify dev-feature gate compiles (operator contract)
        # The InsecureModeLockedOut guidance tells operators to rebuild with
        # `cargo build --features dev`; this guard fails if that path breaks
        # (e.g. feature forwarding removed — prompt-03 post-merge review F7).
        run: cargo check -p chv-controlplane -p chv-agent --features dev

      - name: Validate VERSION format
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$VERSION' does not match SemVer (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "VERSION=$VERSION is valid"

      - name: Validate crate versions match VERSION
        run: |
          VERSION=$(cat VERSION)
          MISMATCH=0
          for crate_toml in cmd/*/Cargo.toml; do
            CRATE_VERSION=$(grep '^version = ' "$crate_toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$VERSION" != "$CRATE_VERSION" ]; then
              echo "VERSION file ($VERSION) does not match $crate_toml ($CRATE_VERSION)"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -eq 1 ]; then
            exit 1
          fi
          echo "All crate versions match VERSION"

      - name: Build chvctl
        run: cargo build --package chvctl

      - name: Smoke test chvctl version output
        run: |
          set -e
          VERSION=$(cat VERSION)
          OUTPUT=$(./target/debug/chvctl version)
          echo "chvctl version output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "$VERSION"; then
            echo "Expected version $VERSION in output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "commit"; then
            echo "Expected 'commit' in version output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "build"; then
            echo "Expected 'build' in version output"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "channel"; then
            echo "Expected 'channel' in version output"
            exit 1
          fi

      - name: Verify embedded commit sha matches HEAD
        # The build.rs embeds `git rev-parse --short HEAD`; with a warm
        # cargo cache (Swatinem/rust-cache) a stale sha used to survive
        # rebuilds that reused the target dir. Assert the binary reports
        # the commit that is actually checked out.
        run: |
          set -e
          OUTPUT=$(./target/debug/chvctl version)
          EMBEDDED_SHA=$(echo "$OUTPUT" | grep -oE 'commit [0-9a-f]+' | awk '{print $2}')
          HEAD_SHA=$(git rev-parse --short HEAD)
          echo "embedded sha: $EMBEDDED_SHA"
          echo "HEAD sha:     $HEAD_SHA"
          if [ "$EMBEDDED_SHA" != "$HEAD_SHA" ]; then
            echo "Embedded commit sha ($EMBEDDED_SHA) does not match HEAD ($HEAD_SHA)"
            exit 1
          fi

      - name: Run smoke-version.sh if present
        run: |
          if [ -x ./scripts/smoke-version.sh ]; then
            ./scripts/smoke-version.sh
          else
            echo "scripts/smoke-version.sh not found, skipping"
          fi

      - name: Run smoke-bump-version.sh if present
        # Regression test for the sed-escaping bug that corrupted the
        # bridge CIDR during the 0.3.0 release cut (PR #473 follow-up).
        # Self-contained: fixture tree, no cargo/network.
        run: |
          if [ -x ./scripts/smoke-bump-version.sh ]; then
            ./scripts/smoke-bump-version.sh
          else
            echo "scripts/smoke-bump-version.sh not found, skipping"
          fi

      - name: Hosting template copies must not drift
        # Root copies are hand-published; scripts/bump-version.sh rewrites
        # all four. Fail the PR if only one side changed.
        run: |
          for f in cloudflare-worker.js github-pages-index.html; do
            cmp "$f" "scripts/hosting/$f"
          done

  promtool:
    name: Prometheus rules (promtool)
    runs-on: ubuntu-latest
    # Independent of the Rust build: this only downloads a pinned promtool
    # and parses monitoring/rules/*.yml. A hang can only come from the
    # release download, so fail fast rather than burn a runner.
    timeout-minutes: 10
    env:
      PROMETHEUS_VERSION: v3.15.1
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install promtool (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$tmpdir/${tarball}" \
            "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/${tarball}"
          (
            cd "$tmpdir"
            echo "${PROMETHEUS_SHA256}  ${tarball}" | sha256sum -c -
          )
          tar -xzf "$tmpdir/${tarball}" -C "$tmpdir"
          sudo install -m 0755 \
            "$tmpdir/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64/promtool" \
            /usr/local/bin/promtool
          promtool --version

      - name: promtool check rules
        # nullglob makes an empty match an explicit failure instead of
        # passing a literal "monitoring/rules/*.yml" to promtool.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(monitoring/rules/*.yml)
          if (( ${#files[@]} == 0 )); then
            echo "No rule files matched monitoring/rules/*.yml" >&2
            exit 1
          fi
          promtool check rules "${files[@]}"
  coverage:
    name: Rust coverage (ratchet, lines >= 76%)
    runs-on: ubuntu-latest
    # Blocking floor for #659. The reproducible `main` baseline is 78.97%
    # lines, measured from the lcov artifact of run 41669901088
    # (https://github.com/o3kio/chv/actions/runs/41669901088/job/126035158484).
    # 76% leaves ~3 points of headroom for unrelated refactors while still
    # catching a real regression. This is a FLOOR, not a trend ratchet: it
    # does not compare against the previous PR, so a slow drift between
    # baseline refreshes is invisible. Refresh the number from a scheduled
    # `main` artifact and raise it deliberately; never lower it to make a red
    # PR green. A per-PR delta check is tracked as a follow-up (it is not
    # added here because it needs a stable main-baseline service). A
    # coverage-tooling failure is a real failure now; there is no
    # continue-on-error escape hatch.
    # Making this check *required* for merges is a GitHub ruleset admin step
    # (see docs/governance/BRANCH_PROTECTION.md); the workflow itself cannot
    # express that.
    # Same hang guard as the rust job: a stuck apt/protoc install must fail
    # fast rather than burn a runner until the 6-hour cap. Cold instrumented
    # builds are slower than plain tests, hence the same 45-minute budget.
    timeout-minutes: 45
    # PR/push-only lane: release.yml calls ci.yml with
    # skip_optional_checks: true so a tag release does not pay for the
    # instrumented coverage run. Direct PR/push/dispatch runs use the input's
    # default false and therefore run this job.
    if: ${{ !inputs.skip_optional_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (pinned 2026-09-30)

      - name: Install protoc
        # The workspace build scripts (tonic-prost-build) need protoc even
        # when the generated sources are already checked in.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov
        # Pinned for the same reproducibility reason as cargo-nextest above.
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install llvm-tools-preview
        # cargo-llvm-cov needs the llvm-profdata/llvm-cov binaries shipped
        # with this rustup component for the pinned toolchain.
        run: rustup component add llvm-tools-preview

      - name: Install cargo-nextest
        # Coverage uses `cargo llvm-cov nextest`, so install the same pinned
        # nextest as the Rust checks job. The dedicated `coverage` profile
        # carries the retry budget; the default profile (Rust checks) has 0.
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: cargo-nextest@0.9.151

      - name: Run coverage (lcov, nextest coverage profile, floor at 76% lines)
        # --profile coverage is the ONLY place retries are enabled
        # (.config/nextest.toml: retries=2, fail-fast=false); Rust checks
        # stays at retries=0. --no-fail-fast keeps the full blast radius
        # visible. --fail-under-lines makes this job blocking: the command
        # exits non-zero when line coverage drops below the floor, in addition
        # to failing on build/test errors. Keep the lcov output so the
        # artifact and summary below still publish on a floor failure.
        run: >-
          cargo llvm-cov nextest --workspace --profile coverage
          --lcov --output-path lcov.info --fail-under-lines 76 --no-fail-fast

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Rust coverage floor (minimum 76% lines, #659)"
            echo ""
            echo "Reproducible \`main\` baseline: **78.97% lines** (run"
            echo "41669901088, [job 126035158484](https://github.com/o3kio/chv/actions/runs/41669901088/job/126035158484))."
            echo "This job fails below **76%** (\`--fail-under-lines 76\`)."
            echo "This is a floor, not a per-PR trend ratchet; refresh the"
            echo "baseline from a \`main\` artifact and raise it deliberately."
            echo "Full lcov report is attached to this run as \`rust-coverage-lcov\`."
            echo ""
            echo '```'
            cargo llvm-cov report --summary-only \
              || echo "coverage summary unavailable (the instrumented run produced no profiles)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    # Same guard as the rust job (see there): a hung install step must
    # fail fast, not burn a runner until the 6-hour cap. Normal runtime
    # ~1 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Build UI
        run: cd ui && npm run build

      - name: Run check (if exists)
        run: |
          cd ui
          if node -e "const pkg=require('./package.json'); if(pkg.scripts&&pkg.scripts.check){process.exit(0)}else{process.exit(1)}"; then
            npm run check
          else
            echo "check script not found in package.json, skipping"
          fi

  ui-unit:
    name: UI unit tests (Vitest)
    runs-on: ubuntu-latest
    # Vitest over src/**/*.test.ts (jsdom). Same install/runner shape as the
    # UI job; kept separate so a unit-test failure is distinguishable from a
    # build/type-check failure. Normal runtime ~1-2 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Run unit tests
        run: cd ui && npm run test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps

      - name: Build UI
        run: cd ui && npm run build

      - name: Start mock BFF server
        run: node ui/tests/e2e/mock-bff.mjs &
        env:
          MOCK_BFF_PORT: 8888

      - name: Run Playwright tests
        run: cd ui && npm run test:e2e
        env:
          BFF_BASE_URL: http://localhost:8888

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-mock-bff-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: warn

  # One real wire, not a stub: this lane boots the actual Rust control plane
  # (BFF router + serialization) against a disposable SQLite database with a
  # seeded admin user, then drives the SvelteKit login + dashboard through
  # Playwright. The mock-BFF suite above stays fast and independent; this job
  # is the contract tripwire for wire-shape drift (#659).
  real-bff-e2e:
    name: Real-BFF E2E
    runs-on: ubuntu-latest
    # Same PR/push-only gate as coverage: release.yml passes
    # skip_optional_checks: true so the release gate does not gain a second
    # long build path. Direct PR/push/dispatch runs use the default false.
    if: ${{ !inputs.skip_optional_checks }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (pinned 2026-09-30)

      - name: Install protoc and htpasswd
        # protoc is required by the workspace build scripts; htpasswd (from
        # apache2-utils) generates the seeded admin's bcrypt hash. The
        # real-bff harness also accepts python3-bcrypt when present.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler apache2-utils

      - name: Build control plane with the dev feature
        # CHV_ALLOW_INSECURE=1 (loopback, ephemeral SQLite) is only accepted
        # by a build that carries the `dev` feature; the fail-closed gate is
        # documented in crates/chv-controlplane-service/src/peer_identity.rs.
        run: cargo build --package chv-controlplane --features dev

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Install Playwright browsers
        run: cd ui && npx playwright install --with-deps

      - name: Run real-BFF Playwright flow
        # The harness owns the control-plane lifecycle: migrations, admin
        # seeding, readiness, Playwright, then teardown + log collection.
        env:
          REAL_BFF_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/real-bff
        run: |
          ./scripts/integration/real-bff-e2e.sh \
            --binary target/debug/chv-controlplane \
            -- bash -c 'cd ui && npx playwright test tests/e2e/real-bff.spec.ts'

      - name: Upload real-BFF artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-bff-e2e-report
          path: |
            ui/playwright-report/
            ui/test-results/
            artifacts/real-bff/
          if-no-files-found: warn
