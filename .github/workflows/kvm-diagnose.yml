name: KVM host diagnostic

# One-off, branch-scoped diagnostic for a failed Nightly KVM Qualification run.
# It is not merged and does not publish anything; it reads the preserved
# failed-test directories on the self-hosted runner and uploads the output.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Collect runner and failed-scenario evidence
    runs-on: [self-hosted, linux, x64, chv-kvm]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Collect host, image, and preserved console logs
        run: |
          set -u
          mkdir -p diag
          bash scripts/diag-kvm-host.sh > diag/host.txt 2>&1
          echo "diagnostic bytes: $(wc -c < diag/host.txt)"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kvm-diagnostic-${{ github.run_id }}
          path: diag/host.txt
          if-no-files-found: error
          retention-days: 14
