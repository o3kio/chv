name: Release

# Build, test, and publish CHV releases from git tags.
#
# Supports two release types:
#   - Stable:  vX.Y.Z        (e.g., v0.1.0)
#   - RC:      vX.Y.Z-rc.N   (e.g., v0.1.0-rc.1)
#
# Trigger:
#   - push tags matching v*.*.* or v*.*.*-rc.*
#   - workflow_dispatch for dry-run builds
#
# Safety:
#   - Only tags create releases. Branch pushes do not trigger this workflow.
#   - Publication requires the full CI quality gate (ci.yml via
#     workflow_call) plus cargo audit/cargo deny preflight (#650).
#   - Signing runs in a protected environment with a read-only token and
#     only the checksum files, never build artifacts.
#   - Publishing uses protected GitHub environments.
#   - Package smoke tests must pass before any publishing.
#   - Changelog entry is required for stable releases.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.1.0 or v0.1.0-rc.1). Leave empty for dry-run.'
        required: false
        type: string
      skip_changelog_check:
        description: 'Skip changelog validation (use with caution)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: call the same CI workflow that gates merges (#650)
  # ---------------------------------------------------------------------------
  # Rust fmt/check/clippy --all-targets/test, UI build/check, Vitest
  # (ui-unit), and Playwright e2e all run from ci.yml. Calling the workflow
  # instead of copying its steps means the release gate cannot drift from the
  # merge gate. A tag push does not match ci.yml's own push/PR triggers, so
  # these checks run exactly once per release attempt.
  quality:
    name: Quality gate (CI)
    uses: ./.github/workflows/ci.yml
    with:
      # Coverage and Real-BFF E2E are PR-only lanes. `github.event_name`
      # inside a called workflow is the caller's event (a tag push here), so
      # gate them explicitly and keep the release path free of the
      # instrumented coverage build.
      skip_optional_checks: true

  # ---------------------------------------------------------------------------
  # Supply-chain preflight: the same two gates security.yml enforces on PRs
  # ---------------------------------------------------------------------------
  # ci.yml does not own cargo-audit/cargo-deny (security.yml does), so the
  # release gate runs them here rather than publishing on a stale advisory
  # database. Audit and deny are separate jobs, so one failing cannot mask
  # the other; deny runs the same policy as security.yml.
  security-audit:
    name: Security preflight (cargo audit)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # rustsec/audit-check publishes its result as a check run.
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0 (pinned 2026-09-29)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  security-deny:
    name: Security preflight (cargo deny)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 (pinned 2026-09-30)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (pinned 2026-09-29)
        with:
          # Same policy as security.yml: unmaintained advisories stay visible
          # as warnings while issue #617 tracks the serde_yaml migration;
          # vulnerabilities remain hard failures.
          command: check --warn unmaintained
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # Build release binaries and tarball
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [quality, security-audit, security-deny]
    # Pin to ubuntu-22.04 (glibc 2.35) so dynamically-linked binaries run on
    # the oldest distro in our smoke matrix (debian:12 ships glibc 2.36).
    # ubuntu-latest currently maps to ubuntu-24.04 (glibc 2.39); binaries
    # built there fail to load on debian:12 with "GLIBC_2.3X not found",
    # which the smoke test surfaces as a silent abort during --version checks.
    # Same pin as package-pr.yml. The downstream package/release jobs do not
    # execute these binaries on the runner host (smoke and lifecycle tests
    # run inside Docker containers), so they keep ubuntu-latest.
    # See docs/release/release-implementation-checklist.md (CI matrix item).
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
      tarball_name: ${{ steps.version.outputs.tarball_name }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Parse version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            SHOULD_RELEASE="true"
          else
            VERSION="v$(cat VERSION)"
            SHOULD_RELEASE="false"
          fi

          PKG_VERSION="${VERSION#v}"
          TARBALL_NAME="chv-${PKG_VERSION}-linux-amd64.tar.gz"

          # Detect RC vs stable
          IS_PRERELEASE="false"
          CHANNEL="stable"
          CHV_PKG_PRERELEASE=""

          if [[ "$PKG_VERSION" =~ -rc\.([0-9]+)$ ]]; then
            RC_NUM="${BASH_REMATCH[1]}"
            IS_PRERELEASE="true"
            CHANNEL="rc"
            CHV_PKG_PRERELEASE="rc.${RC_NUM}"
            echo "Detected RC release: rc.${RC_NUM}"
          else
            echo "Detected stable release"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=${TARBALL_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          echo "TARBALL_NAME=${TARBALL_NAME}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
          echo "CHV_PKG_PRERELEASE=${CHV_PKG_PRERELEASE}" >> "$GITHUB_ENV"

      - name: Validate changelog
        if: |
          steps.version.outputs.should_release == 'true' &&
          steps.version.outputs.is_prerelease == 'false' &&
          inputs.skip_changelog_check != true
        run: |
          echo "Validating CHANGELOG.md entry for ${{ steps.version.outputs.pkg_version }}..."
          ./scripts/release/extract-changelog.sh "${{ steps.version.outputs.pkg_version }}" > /tmp/changelog-section.md
          echo "Changelog section found:"
          head -5 /tmp/changelog-section.md

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (pinned 2026-09-30)

      - name: Install protoc
        # Pinned to a recent protoc (>= 3.15) so proto3 optional fields work
        # without --experimental_allow_proto3_optional. Ubuntu 22.04's apt
        # package ships protoc 3.12, which predates that flag becoming
        # default. The arduino/setup-protoc action installs an official
        # protobuf release binary into the runner toolchain.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3 (pinned 2026-09-30)
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust workspace (release)
        run: cargo build --workspace --release

      - name: Verify embedded commit sha matches HEAD
        # The build.rs embeds `git rev-parse --short HEAD`; with a warm
        # cargo cache (Swatinem/rust-cache) a stale sha used to survive
        # rebuilds that reused the target dir. Assert the binary reports
        # the commit that is actually checked out.
        run: |
          set -e
          OUTPUT=$(./target/release/chvctl version)
          EMBEDDED_SHA=$(echo "$OUTPUT" | grep -oE 'commit [0-9a-f]+' | awk '{print $2}')
          HEAD_SHA=$(git rev-parse --short HEAD)
          echo "embedded sha: $EMBEDDED_SHA"
          echo "HEAD sha:     $HEAD_SHA"
          if [ "$EMBEDDED_SHA" != "$HEAD_SHA" ]; then
            echo "Embedded commit sha ($EMBEDDED_SHA) does not match HEAD ($HEAD_SHA)"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (pinned 2026-09-30)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: cd ui && npm ci && npm run build

      - name: Assemble release tarball
        # Shared assembler (scripts/release/assemble-tarball.sh) — the same
        # single source of truth scripts/build-release.sh uses. This workflow
        # previously inlined its own assembly, which drifted from
        # build-release.sh (missing tmpfiles/chv-node.conf, which install.sh
        # requires, and no checksum). Passing the tag-derived PKG_VERSION
        # publishes the asset exactly where install.sh looks:
        #   releases/download/v<version>/chv-<version>-linux-amd64.tar.gz
        run: ./scripts/release/assemble-tarball.sh "${PKG_VERSION}"

      - name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-binaries
          path: |
            target/release/chvctl
            target/release/chv-agent
            target/release/chv-controlplane
            target/release/chv-monitor-agent
            target/release/chv-nwd
            target/release/chv-stord

      - name: Upload UI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: ui-build
          path: ui/build/**

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-tarball
          path: |
            dist/${{ env.TARBALL_NAME }}
            dist/${{ env.TARBALL_NAME }}.sha256

      - name: Upload tarball checksum for signing
        # Small artifact so the protected signing job downloads only the
        # checksum sidecar, not the tarball/binaries/packages (#650).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-tarball-checksum
          path: dist/${{ env.TARBALL_NAME }}.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build packages and run smoke tests
  # ---------------------------------------------------------------------------
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build
    outputs:
      pkg_version_deb: ${{ steps.pkg.outputs.pkg_version_deb }}
      pkg_version_rpm: ${{ steps.pkg.outputs.pkg_version_rpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-binaries
          path: target/release/

      - name: Download UI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: ui-build
          path: ui/build/

      - name: Restore binary executable permissions
        # actions/upload-artifact does not preserve file permission bits:
        # the downloaded binaries arrive 0644, get packaged non-executable,
        # and the smoke tests catch it as "Permission denied" (exit 126) —
        # the failure every prior Release run died on (June 2 run included).
        # Restore +x before packaging. The PR/nightly packaging workflows
        # build and package in the same job (no artifact round-trip) and are
        # unaffected.
        run: |
          chmod +x target/release/chvctl \
                  target/release/chv-agent \
                  target/release/chv-controlplane \
                  target/release/chv-monitor-agent \
                  target/release/chv-nwd \
                  target/release/chv-stord

      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz" | tar -xz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build packages
        id: pkg
        run: |
          export CHV_PKG_PRERELEASE="${{ needs.build.outputs.channel == 'rc' && needs.build.outputs.pkg_version || '' }}"
          # For RC, extract the rc.N suffix from the version
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi

          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

          echo "pkg_version_deb=$(./scripts/version.sh --deb)" >> "$GITHUB_OUTPUT"
          echo "pkg_version_rpm=$(./scripts/version.sh --rpm)" >> "$GITHUB_OUTPUT"

      - name: Check packages
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/check-package-files.sh
          ./scripts/package/check-safety.sh

      - name: Smoke test .deb packages
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-deb.sh dist/packages

      - name: Smoke test .rpm packages
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/package/smoke-rpm.sh dist/packages

      - name: Build old version packages for lifecycle test
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          export PACKAGE_VERSION="0.0.1"
          ./scripts/build-packages.sh --skip-build
          rm -rf dist/packages-old
          mkdir -p dist/packages-old
          cp dist/packages/* dist/packages-old/
          # The 0.0.1 probe packages exist only so the upgrade test has an
          # older release to install. Drop them before the real build:
          # leaving them in dist/packages published 0.0.1 assets and listed
          # them in SHA256SUMS (observed on v0.4.0-rc.1 and v0.3.0).
          rm -rf dist/packages

      - name: Build new version packages
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          export PACKAGE_VERSION="$(./scripts/version.sh --deb)"
          ./scripts/build-packages.sh --skip-build

      - name: Lifecycle test .deb packages
        run: |
          ./scripts/package/lifecycle-deb.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Lifecycle test .rpm packages
        run: |
          ./scripts/package/lifecycle-rpm.sh --new-packages dist/packages --old-packages dist/packages-old

      - name: Assert only the release version is staged
        # The lifecycle probe (0.0.1) must never reach the published set.
        # This is a runtime backstop for the workflow-ordering invariant:
        # fail closed on any foreign version rather than publish it.
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          RAW_VERSION="$(./scripts/version.sh --deb)"
          ASSET_VERSION="$(printf '%s' "$RAW_VERSION" | tr -c 'A-Za-z0-9._-' '.')"
          bad=""
          for pkg in dist/packages/*.deb dist/packages/*.rpm; do
            [ -e "$pkg" ] || continue
            base="$(basename "$pkg")"
            # Delimiter-aware: an rc.1 prefix must not accept rc.10.
            case "$base" in
              *_"${ASSET_VERSION}"_*.deb|*-"${ASSET_VERSION}"-*.rpm) ;;
              *) bad="${bad}${base}"$'\n' ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "Refusing to publish package(s) that are not ${ASSET_VERSION}:" >&2
            printf '%s' "$bad" >&2
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          cd dist/packages
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS

      - name: Upload package checksums for signing
        # Signing runs in its own protected job (see `sign` below); hand it
        # only SHA256SUMS instead of the whole package set (#650).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-package-checksums
          path: dist/packages/SHA256SUMS
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sign checksums in a protected environment
  # ---------------------------------------------------------------------------
  # Signing was previously a step inside the unprotected `package` job. It is
  # now isolated: read-only token, only the two checksum files, and the same
  # protected `rc`/`production` environments as the release job. No build
  # binaries or packages are available to this job.
  sign:
    name: Sign artifacts
    runs-on: ubuntu-latest
    # A hung key-import/cosign download must not hold the protected
    # environment open indefinitely.
    timeout-minutes: 20
    needs: [build, package]
    if: needs.build.outputs.should_release == 'true'
    environment: ${{ needs.build.outputs.is_prerelease == 'true' && 'rc' || 'production' }}
    permissions:
      contents: read
    env:
      TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
      CHV_REQUIRE_SIGNING: ${{ vars.CHV_REQUIRE_SIGNING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download tarball checksum sidecar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-tarball-checksum
          path: dist/

      - name: Download package checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-package-checksums
          path: dist/packages/

      - name: Verify checksum inputs
        # Fail before signing if either input is missing/empty: an empty
        # checksum file would otherwise be signed and published as authentic.
        run: |
          set -euo pipefail
          test -s "dist/${TARBALL_NAME}.sha256" || {
            echo "Missing dist/${TARBALL_NAME}.sha256 — refusing to sign" >&2
            exit 1
          }
          test -s dist/packages/SHA256SUMS || {
            echo "Missing dist/packages/SHA256SUMS — refusing to sign" >&2
            exit 1
          }
          wc -l "dist/${TARBALL_NAME}.sha256" dist/packages/SHA256SUMS

      - name: Sign SHA256SUMS
        run: ./scripts/release/sign-checksums.sh dist/packages/SHA256SUMS
        env:
          CHV_RELEASE_GPG_KEY: ${{ secrets.CHV_RELEASE_GPG_KEY }}
          CHV_RELEASE_GPG_PASSPHRASE: ${{ secrets.CHV_RELEASE_GPG_PASSPHRASE }}
          CHV_RELEASE_COSIGN_KEY: ${{ secrets.CHV_RELEASE_COSIGN_KEY }}
          CHV_RELEASE_COSIGN_PASSWORD: ${{ secrets.CHV_RELEASE_COSIGN_PASSWORD }}
          # Repository variable (not a secret): set to 1 to make missing/broken
          # signing fail the release instead of degrading gracefully.
          CHV_REQUIRE_SIGNING: ${{ vars.CHV_REQUIRE_SIGNING }}

      - name: Sign tarball checksum sidecar
        # scripts/install.sh verifies the tarball against
        # chv-<version>-linux-amd64.tar.gz.sha256; installers that support
        # signature verification look for the matching .sha256.sig. Signing
        # the sidecar makes that exact published asset authentic (#650).
        run: ./scripts/release/sign-checksums.sh "dist/${TARBALL_NAME}.sha256"
        env:
          CHV_RELEASE_GPG_KEY: ${{ secrets.CHV_RELEASE_GPG_KEY }}
          CHV_RELEASE_GPG_PASSPHRASE: ${{ secrets.CHV_RELEASE_GPG_PASSPHRASE }}
          CHV_RELEASE_COSIGN_KEY: ${{ secrets.CHV_RELEASE_COSIGN_KEY }}
          CHV_RELEASE_COSIGN_PASSWORD: ${{ secrets.CHV_RELEASE_COSIGN_PASSWORD }}
          CHV_REQUIRE_SIGNING: ${{ vars.CHV_REQUIRE_SIGNING }}

      - name: Record signing status
        # Guarantees the signature artifact exists even when signing is not
        # configured, so the release job can download it unconditionally.
        run: |
          {
            echo "channel=${{ needs.build.outputs.channel }}"
            echo "require_signing=${{ vars.CHV_REQUIRE_SIGNING || '0' }}"
            echo "signature files:"
            find dist -name '*.sig' -type f -printf '%p\n' | sort || true
          } > dist/SIGNING-STATUS.txt
          cat dist/SIGNING-STATUS.txt

      - name: Upload signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned 2026-09-30)
        with:
          name: release-signatures
          path: |
            dist/*.sha256.sig
            dist/*.sha256.cosign.sig
            dist/packages/SHA256SUMS.sig
            dist/packages/SHA256SUMS.cosign.sig
            dist/SIGNING-STATUS.txt
          # Signature files are optional while no keys are configured; the
          # status file always matches, so the artifact is always created.
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release and publish artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publication depends on the full gate: CI (quality), supply-chain
    # preflight, both build/package jobs, and the protected signing job.
    needs: [quality, security-audit, security-deny, build, package, sign]
    if: needs.build.outputs.should_release == 'true'
    environment: ${{ needs.build.outputs.is_prerelease == 'true' && 'rc' || 'production' }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-tarball
          path: dist/

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-packages
          path: dist/packages/

      - name: Download signatures
        # Artifact paths are rooted at dist/ in the sign job, so this restores
        # dist/<tarball>.sha256.sig and dist/packages/SHA256SUMS*.sig. The
        # artifact always exists (SIGNING-STATUS.txt), even unsigned.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-signatures
          path: dist/

      - name: Stage artifacts
        run: |
          ls -la dist/
          ls -la dist/packages/

      - name: Verify artifacts against their checksums
        # The checksum sidecars are what the installer trusts. Verify the
        # downloaded tarball and packages against them immediately before
        # publishing so a truncated/mixed artifact set cannot be released
        # under a valid signature.
        env:
          TARBALL_NAME: ${{ needs.build.outputs.tarball_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c --strict "${TARBALL_NAME}.sha256")
          (cd dist/packages && sha256sum -c --strict SHA256SUMS)

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0 (pinned 2026-09-30)
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/sbom.spdx.json
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0 (pinned 2026-09-30)
        with:
          path: ./dist
          format: cyclonedx-json
          output-file: ./dist/sbom.cyclonedx.json
          upload-release-assets: false

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4 (pinned 2026-09-30)
        with:
          subject-path: |
            dist/chv-*.tar.gz
            dist/chv-*.tar.gz.sha256
            dist/packages/*.deb
            dist/packages/*.rpm

      - name: Prepare release notes
        run: |
          VERSION="${{ needs.build.outputs.pkg_version }}"
          # Release assets use GitHub's filename-safe version (0.4.0~rc.1 ->
          # 0.4.0.rc.1), so install snippets must not name a '~' file the
          # release page cannot serve. VERSION itself stays the changelog key.
          ASSET_VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '.')"
          IS_PRERELEASE="${{ needs.build.outputs.is_prerelease }}"

          # Try to extract changelog section
          if ./scripts/release/extract-changelog.sh "$VERSION" > /tmp/changelog-body.md 2>/dev/null; then
            echo "Using CHANGELOG.md section for release notes"
            cp /tmp/changelog-body.md /tmp/release-notes.md
          else
            echo "No changelog entry found for ${VERSION} — using generic release notes"
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              cat > /tmp/release-notes.md <<EOF
          ## CHV ${VERSION} (Release Candidate)

          > ⚠️ This is a release candidate. It has passed automated tests but may still contain issues.
          > Do not use in production without additional validation.

          ### Install

          **Debian / Ubuntu**
          \`\`\`bash
          sudo dpkg -i chv-controlplane_${ASSET_VERSION}_amd64.deb
          sudo dpkg -i chv-node_${ASSET_VERSION}_amd64.deb
          sudo dpkg -i chvctl_${ASSET_VERSION}_amd64.deb
          \`\`\`

          **RHEL / CentOS / Fedora**
          \`\`\`bash
          sudo rpm -i chv-controlplane-${ASSET_VERSION}-1.x86_64.rpm
          sudo rpm -i chv-node-${ASSET_VERSION}-1.x86_64.rpm
          sudo rpm -i chvctl-${ASSET_VERSION}-1.x86_64.rpm
          \`\`\`
          EOF
            else
              cat > /tmp/release-notes.md <<EOF
          ## CHV ${VERSION}

          ### Install

          **Debian / Ubuntu**
          \`\`\`bash
          sudo dpkg -i chv-controlplane_${ASSET_VERSION}_amd64.deb
          sudo dpkg -i chv-node_${ASSET_VERSION}_amd64.deb
          sudo dpkg -i chvctl_${ASSET_VERSION}_amd64.deb
          \`\`\`

          **RHEL / CentOS / Fedora**
          \`\`\`bash
          sudo rpm -i chv-controlplane-${ASSET_VERSION}-1.x86_64.rpm
          sudo rpm -i chv-node-${ASSET_VERSION}-1.x86_64.rpm
          sudo rpm -i chvctl-${ASSET_VERSION}-1.x86_64.rpm
          \`\`\`
          EOF
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 (pinned 2026-09-30)
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: CHV ${{ needs.build.outputs.version }}
          body_path: /tmp/release-notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            dist/${{ needs.build.outputs.tarball_name }}
            dist/${{ needs.build.outputs.tarball_name }}.sha256
            dist/${{ needs.build.outputs.tarball_name }}.sha256.sig
            dist/${{ needs.build.outputs.tarball_name }}.sha256.cosign.sig
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/SHA256SUMS
            dist/packages/SHA256SUMS.sig
            dist/packages/SHA256SUMS.cosign.sig
            dist/sbom.spdx.json
            dist/sbom.cyclonedx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish to package repository (optional)
  # ---------------------------------------------------------------------------
  publish-repo:
    name: Publish to Package Repository
    runs-on: ubuntu-latest
    # Only after the GitHub Release and signing succeeded, and only for an
    # explicit release ref/input on a known channel. The previous
    # `channel != ''` condition was always true (channel is stable|rc).
    needs: [build, package, sign, release]
    if: |
      needs.build.outputs.should_release == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.version != '')) &&
      (needs.build.outputs.channel == 'stable' || needs.build.outputs.channel == 'rc')
    environment: ${{ needs.build.outputs.is_prerelease == 'true' && 'rc-repo' || 'production-repo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (pinned 2026-09-30)

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (pinned 2026-09-30)
        with:
          name: release-packages
          path: dist/packages/

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c curl gnupg

      - name: Publish to repository
        run: |
          if [[ "${{ needs.build.outputs.channel }}" == "rc" ]]; then
            RC_SUFFIX="${{ needs.build.outputs.pkg_version }}"
            RC_SUFFIX="${RC_SUFFIX##*-rc.}"
            export CHV_PKG_PRERELEASE="rc.${RC_SUFFIX}"
          fi
          PKG_VERSION="$(./scripts/version.sh --deb)"

          ./scripts/publish/publish-repo.sh \
            --packages dist/packages \
            --channel "${{ needs.build.outputs.channel }}" \
            --version "$PKG_VERSION"
        env:
          CHV_REPO_URL: ${{ secrets.CHV_REPO_URL }}
          CHV_REPO_S3_BUCKET: ${{ secrets.CHV_REPO_S3_BUCKET }}
          CHV_REPO_S3_PREFIX: ${{ secrets.CHV_REPO_S3_PREFIX }}
          CHV_REPO_RSYNC_TARGET: ${{ secrets.CHV_REPO_RSYNC_TARGET }}
          CHV_REPO_GPG_KEY: ${{ secrets.CHV_REPO_GPG_KEY }}
          CHV_REPO_GPG_PASSPHRASE: ${{ secrets.CHV_REPO_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CHV_REPO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CHV_REPO_AWS_SECRET_ACCESS_KEY }}
