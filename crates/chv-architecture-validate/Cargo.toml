[package]
name = "chv-architecture-validate"
version = "0.4.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-controlplane-types = { path = "../chv-controlplane-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "2.0", default-features = false, features = ["serialize", "deserialize"] }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonschema = { version = "0.49", default-features = false }
ipnetwork = "0.21"
async-trait = { workspace = true }

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"
criterion = "0.8"

[[bench]]
name = "large_graph"
harness = false
