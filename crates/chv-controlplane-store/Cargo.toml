[package]
name = "chv-controlplane-store"
version = "0.4.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[features]
test-util = []

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
chv-common = { path = "../chv-common" }
chv-controlplane-types = { path = "../chv-controlplane-types" }
# #379 DP4 follow-up: the shared accept-time class-capability predicate
# (`node_offers_storage_class`) used by `NodeRepository`'s check
# composition — the same vocabulary home the BFF and the lifecycle
# service validate class strings against, never a local copy.
chv-hypervisor-api = { path = "../chv-hypervisor-api" }
aes-gcm = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["uuid", "chrono"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
