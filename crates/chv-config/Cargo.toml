[package]
name = "chv-config"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
chv-common = { path = "../chv-common" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
# Domain-separated derivation of per-purpose secrets from the legacy
# shared `jwt_secret` (HMAC-SHA256). A dedicated KDF dependency would be
# larger than the single HMAC this needs.
hmac = "0.13"
# WHATWG URL parsing for webhook destination validation: reqwest's
# HTTP stack parses URLs with this exact crate, so validating hosts
# with it (canonicalizing integer/hex/mapped IPv6 forms) closes
# parser-differential bypasses of the link-local rejection.
url = "2.5"

[dev-dependencies]
tempfile = { workspace = true }
