# CHV Node Agent Configuration
# Place this file at /etc/chv/agent.toml

socket_path = "/run/chv/agent/api.sock"
runtime_dir = "/var/lib/chv/agent"
log_level = "info"
control_plane_addr = "https://127.0.0.1:8443"
stord_socket = "/run/chv/stord/api.sock"
nwd_socket = "/run/chv/nwd/api.sock"
chv_binary_path = "/usr/bin/cloud-hypervisor"
stord_binary_path = "/usr/bin/chv-stord"
nwd_binary_path = "/usr/bin/chv-nwd"
cache_path = "/var/lib/chv/cache/agent-cache.json"
# Single durable lifecycle authority (prompt-02 cutover): core-managed runs
# CellHV Core as the sole authority on this node — the qualified default.
# "legacy" keeps the agent's own provider-mutation surface and is a
# compatibility adapter only (explicit opt-in; the agent logs a warning).
authority_mode = "core-managed"
core_store_path = "/var/lib/chv/agent/core.db"
core_api_socket_path = "/run/chv/core/core-v1.sock"
core_archive_path = "/var/lib/chv/agent/node-cache-v1.archive"
node_id = ""                  # assigned automatically during enrollment
# Loopback only (never bind metrics to a public interface). Packaged/install.sh
# default: 127.0.0.1:9901. When unset, the code fallback is 127.0.0.1:9100.
metrics_bind = "127.0.0.1:9901"
storage_base_dir = "/var/lib/chv/storage"  # agent probes subdirs for storage classes

# One-time bootstrap token for initial enrollment
bootstrap_token_path = "/etc/chv/bootstrap.token"

# Steady-state TLS paths (populated by the agent after enrollment)
tls_cert_path = "/run/chv/agent/agent.crt"
tls_key_path = "/run/chv/agent/agent.key"
ca_cert_path = "/etc/chv/certs/ca.crt"

# Legacy shared secret (#662). It is now only the migration master: when
# [secrets] keys are absent they are derived from this value with
# HMAC-SHA256 domain separation, matching the control plane's derivation on
# a single-host install. Configure [secrets] explicitly to rotate a purpose
# independently.
jwt_secret = "<same-as-controlplane>"

# Per-purpose secrets (#662).
[secrets]
# console_jwt = "<same as controlplane.toml [secrets] console_jwt>"
# agent_auth_token = "<same as controlplane.toml [secrets] agent_auth_token; one shared value for every agent behind that control plane>"
# credential_encryption is a control-plane-only key; it is accepted here
# for config symmetry but is not used or validated by the agent.

[security]
# Default true. The control plane refuses to start when this is true and
# allow_insecure_agent_auth is also true. On the control plane,
# allow_insecure_agent_auth only relaxes config validation; it never changes
# the token sent to agents.
production = true
# LOCAL DEVELOPMENT ONLY (agent). Disables the per-RPC agent token check and
# the Unix peer-UID gate; refused unless production = false, and a non-dev
# agent build refuses to start with it enabled.
# allow_insecure_agent_auth = false
# Agent-only: Unix UIDs allowed to connect to the agent socket. Empty means
# the agent's own effective UID (the normal single-host control-plane user).
# The control plane ignores this key.
# agent_auth_allowed_peer_uids = []

# Stord path confinement preserved across supervisor respawns (#376).
# Empty/omitted = the respawned daemon runs allow-all (historical
# behavior); deployments relying on stord's path_allowlist mirror it
# here so a respawned stord keeps the operator's posture. Must cover
# the volume locator dir (storage_base_dir and the dirs the agent
# passes as volume locators) and any image/seed dirs.
stord_path_allowlist = ["/var/lib/chv/storage", "/var/lib/chv/agent"]

# Stord respawn config fidelity (#385). Point this at the operator's
# stord.toml and a supervisor respawn execs chv-stord with THAT file
# (validated: its socket_path must match stord_socket above) instead of
# generating a minimal config — runtime_dir, backend_type,
# device_allowlist and [migration] then survive the respawn, and
# stord.db stays where the operator put it. Omitted (default) keeps the
# historical generated-config respawn; an unreadable/malformed file or
# a socket mismatch falls back to it with a loud warning. The agent
# user must be able to read the file (both standard install surfaces
# grant this via the chv-stord group: install.sh and the .deb postinst).
stord_config_path = "/etc/chv/stord.toml"

# Development-only gate for the control plane's explicit tokenless disk
# migration marker (issue #663). Leave false in production: a volume with no
# per-volume control-plane authorization is then refused before stord is
# contacted. Enabling this requires the control plane's and destination
# stord's matching insecure flags, and lets any CA-certified peer create
# receiving volumes.
# allow_insecure_migration_dispatch = true

# nwd respawn config fidelity (#504). Same pass-through for the network
# daemon: point this at the operator's nwd.toml and a supervisor
# respawn execs chv-nwd with THAT file (validated: its socket_path must
# match nwd_socket above) instead of generating a minimal config — the
# [overlay], [ebpf] and [fabric] blocks (and any future key) then
# survive the respawn. Omitted (default) keeps the historical
# generated-config respawn; an unreadable/malformed file or a socket
# mismatch falls back to it with a loud warning. The agent user must be
# able to read the file (the standard install ships nwd.toml as
# root:chv 0640).
nwd_config_path = "/etc/chv/nwd.toml"
