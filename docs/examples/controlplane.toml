# CHV Control Plane Configuration
# Place this file at /etc/chv/controlplane.toml

grpc_bind = "127.0.0.1:8443"
http_bind = "127.0.0.1:8080"
# Dedicated Prometheus listener (issue #657): unauthenticated and loopback by
# default, so scraping never requires a rotating admin JWT. The legacy
# /metrics route on http_bind stays admin-gated for compatibility. To scrape
# remotely, bind a specific management address (never 0.0.0.0) and firewall
# it, or front the loopback listener with an operator-managed reverse proxy.
metrics_bind = "127.0.0.1:9103"
log_level = "info"
runtime_dir = "/run/chv/controlplane"
agent_runtime_dir = "/var/lib/chv/agent"

# Legacy shared secret (#662). It is now only the migration master: the
# per-purpose keys below are derived from it when they are not configured
# explicitly. Keep it to avoid re-keying existing installs, but configure
# [secrets] for independent rotation.
# Generate with: openssl rand -base64 32 | tr -d '=+/'
jwt_secret = "<replace-me>"

# Per-purpose secrets (#662). Every value must be >=32 characters and
# distinct from the others. When omitted, the key is derived from the
# legacy jwt_secret with HMAC-SHA256 domain separation, so an existing
# single-host install stays operational (the first upgrade invalidates
# existing user sessions / console URLs once); explicit values are
# required to rotate one purpose without rotating the others.
[secrets]
# user_jwt = "<openssl rand -hex 32>"
# console_jwt = "<same as agent.toml [secrets] console_jwt>"
# agent_auth_token is one shared value sent to every agent this control
# plane serves, so all of their agent.toml files must match it. Per-node
# tokens are future ADR-029 work; rotating one agent alone requires re-keying
# the control plane or a maintenance window.
# agent_auth_token = "<same as every served agent.toml [secrets] agent_auth_token>"
# credential_encryption = "<dedicated at-rest key; overrides CHV_ENCRYPTION_KEY>"

[security]
# Fail-closed default: the agent-auth development bypass is refused.
production = true
# allow_insecure_agent_auth = false   # LOCAL DEVELOPMENT ONLY, never production
# On the control plane this key only relaxes config validation; it never
# changes the token sent to agents. agent_auth_allowed_peer_uids is an
# agent-only key and is ignored here.

# Dedicated migration-authorization secret (issue #663). The control plane
# mints one short-lived token per attached volume; destination stords verify
# it before creating a receiving volume. This secret is deliberately separate
# from jwt_secret: rotating user auth must not invalidate in-flight
# migrations, and a leak of one domain must not compromise the other.
#
# Required for a control plane that migrates VMs with attached volumes. A
# missing secret is allowed at startup (a deployment that never migrates
# still boots) but migration dispatch then fails closed before contacting
# the agent. Generate a >= 32-byte secret and share the same file with every
# destination stord:
#   openssl rand -hex 32 > /etc/chv/migration/signing-secret
#   chown root:chv /etc/chv/migration/signing-secret && chmod 0640 ...
#
# [migration]
# signing_secret_file = "/etc/chv/migration/signing-secret"
# token_ttl_seconds = 300          # default; receiver hard-caps at 900
# signing_secret = "..."           # inline alternative, mutually exclusive
# CHV_MIGRATION_SIGNING_SECRET is the environment fallback.
#
# Development-only: dispatch disk migrations without tokens. NEVER enable in
# production (destination stords must also opt in, and any CA-certified peer
# could then create receiving volumes).
#
# allow_insecure_unauthenticated = true

[database]
url = "sqlite:///var/lib/chv/controlplane.db"
migrations_dir = "/usr/local/share/chv/migrations"
max_connections = 4
min_connections = 1
acquire_timeout_secs = 5

# Native monitoring history (ADR-027): disposable telemetry in a
# separate SQLite file with its own pool. A missing/corrupt/full
# monitoring database degrades monitoring only — VM lifecycle is
# unaffected. Disable with `enabled = false` to answer every ingest
# with `ingestion_unavailable`.
[monitoring]
enabled = true
database_url = "sqlite:///var/lib/chv/monitoring/monitoring.db"
migrations_dir = "/usr/local/share/chv/monitoring-migrations"
maintenance_interval_secs = 60
raw_retention_hours = 48
rollup_5m_retention_days = 30
rollup_1h_retention_days = 180
max_series_per_target = 1024
min_headroom_mib = 256
max_db_gib = 2
batches_per_minute = 20

# Optional guest monitoring agent ingestion (ADR-026). Disabled by
# default: enabling it is a deployment decision, never a requirement —
# VMs without the guest agent remain fully usable. Enabling requires
# [http_tls] below AND a dedicated agent CA: the manager refuses to
# boot with guest_ingestion enabled but either piece missing (loud
# failure, never silent degradation).
#
# The agent CA MUST be separate from the node-enrollment CA above:
# agent certificates carry no node identity (OU=chv-monitor-agent,
# clientAuth EKU only) and the two credential domains must stay
# separable for revocation.
[monitoring.guest_ingestion]
enabled = false
# Base URL guest agents use to reach this manager (shown in the
# enrollment instructions). Must be reachable from the VM network.
# public_base_url = "https://manager.example.internal:8443"
agent_ca_cert_path = "/etc/chv/certs/monitor-agent-ca.crt"
agent_ca_key_path = "/etc/chv/certs/monitor-agent-ca.key"
# Security-contract limits: short-lived credentials, single-use
# claims, rate-limited enrollment and ingestion.
credential_ttl_days = 30
renewal_window_days = 7
rotation_grace_minutes = 30
claim_ttl_seconds = 600
enroll_attempts_per_minute = 10
agent_batches_per_minute = 12
offline_after_seconds = 90
enrollment_grace_seconds = 600

# Native alerting (ADR-027, G4 part 2). On by default but a strict
# no-op until rules exist: the default install (zero rules) evaluates
# nothing, opens no incidents and notifies nobody. The evaluator only
# runs while the monitoring store is connected.
[monitoring.alerting]
enabled = true
evaluation_interval_secs = 15
# Ceiling on stored rules (per-target rules in v1); creating beyond
# the ceiling fails loudly instead of silently overloading the tick.
max_rules = 200

# Outbound notifications (ADR-027, G4 part 2). Everything optional and
# unset by default: with no destination configured, incidents are
# visible in the UI only and no outbox events are enqueued.
# Destinations come ONLY from this section — that is the allowlist;
# alert rules and the UI can never direct a notification anywhere.
# URLs must be https://, carry no credentials, and avoid link-local
# addresses (cloud metadata services live there). Loopback and
# private ranges are allowed on purpose: an internal receiver is a
# legitimate operator-configured destination.
#
# When a destination is set, webhook_signing_secret is REQUIRED (>= 16
# bytes); deliveries are signed HMAC-SHA256 (X-CHV-Signature: v1=…).
# Rotate the secret by changing it here and restarting: receivers that
# verify signatures should accept a brief overlap window of both
# secrets.
# webhook_url = "https://alerts.example.internal/hooks/chv"
# webhook_signing_secret = "change-me-32-bytes-of-entropy-minimum"
# slack_webhook_url = "https://hooks.slack.com/services/T000/B000/XXXX"
# Optional PEM CA bundle for internal destinations (system roots
# otherwise):
# webhook_ca_path = "/etc/chv/certs/internal-webhook-ca.crt"
[monitoring.notifications]
max_attempts = 8
dispatch_interval_secs = 5
max_batch = 10

# Optional external export (ADR-027 decision 9): push selected
# monitoring series to an external backend over Prometheus
# remote-write v1 (VictoriaMetrics/Prometheus/Mimir-compatible).
# OFF by default and inert without an explicit metric_ids selection —
# export is an egress surface, so the data selection is always an
# operator decision. The worker degrades but never blocks: ingest,
# queries, alerting and VM lifecycle are unaffected by destination
# outages (bounded backfill, skipped with a time-range warning
# beyond it, degraded gauge + warnings while behind).
#
# Requirements when enabled: an https:// destination (URL-validated:
# no credentials in the URL, no link-local/unspecified IPs; internal
# private receivers are fine) and a non-empty metric_ids list from
# the v1 registry vocabulary (unknown ids fail startup loudly).
# target_kinds (node|vm) and sources (node_os|vmm|vm_cgroup|
# storage_provider|network_provider|guest_agent|derived) are optional
# filters; empty means everything the metric allows.
#
# lag_degraded_secs must not exceed max_backfill_secs.
# [monitoring.export]
# enabled = true
# destination_url = "https://victoriametrics.internal:8428/api/v1/write"
# bearer_token_path = "/etc/chv/export.token"
# ca_cert_path = "/etc/chv/certs/internal-vm-ca.crt"
# interval_secs = 15
# max_backfill_secs = 600
# lag_degraded_secs = 120
# metric_ids = [
#   "node.cpu.capacity_ratio",
#   "vm.cpu.capacity_ratio",
#   "vm.memory.guest_available_bytes",
# ]
# target_kinds = ["node", "vm"]
# sources = []

[tls]
# CA certificate and key used to issue node certificates during enrollment
ca_cert_path = "/etc/chv/certs/ca.crt"
ca_key_path = "/etc/chv/certs/ca.key"

# gRPC server TLS — generated by install.sh (self-signed, CA-issued)
server_cert_path = "/etc/chv/certs/server.crt"
server_key_path = "/etc/chv/certs/server.key"

# HTTPS listener for the WebUI/BFF and guest agent ingestion. When
# unset, the HTTP listener serves the browser API only and guest
# ingestion stays disabled. When set, the listener serves TLS for
# everything; browser sessions connect without a client certificate,
# guest agents present one signed by [monitoring.guest_ingestion]'s
# agent CA (optional client verification — the agent routes require
# the certificate, the browser routes ignore it).
[http_tls]
server_cert_path = "/etc/chv/certs/http-server.crt"
server_key_path = "/etc/chv/certs/http-server.key"
# Client CA for mTLS verification (agents present certs signed by this CA)
client_ca_path = "/etc/chv/certs/ca.crt"

# Web UI static serving (issue #447, decision D3 target). Disabled by
# default — fail-closed: no static assets are served unless enabled.
# When enabled, the control plane serves the UI from its HTTP listener
# (http_bind): request paths outside the reserved API prefixes
# (/v1, /api, /admin, /health*, /ready, /internal, /metrics) are served
# from `dir`, with an SPA fallback to index.html; index.html is served
# no-cache and /_app/immutable/ with a 1-year immutable Cache-Control.
# The serial console (/ws/...) still requires an edge proxy — see
# docs/DEPLOYMENT.md "Serving the Web UI in package mode".
[webui]
enabled = false
# Default: where the .deb/.rpm installs the tree. scripts/install.sh
# uses /opt/chv/ui and enables this section for its own tree.
dir = "/usr/share/chv/ui"

# Durable privileged-mutation audit log (#658). The BFF writes one row
# per mutating request (success, failure, or role/auth denial) into the
# control-plane database. Admin-only query/export endpoints live at
# POST /v1/audit-log and POST /v1/audit-log/export.
#
# retention_days is deliberately conservative (365) but bounded: a
# periodic worker deletes only rows strictly older than the cutoff.
# sweep_interval_secs is floored at 60. Set retention_days lower only
# after checking your compliance/incident-review requirements.
#
# max_rows is a hard ceiling on the audit table: after every age sweep
# the worker prunes down to the newest max_rows rows (oldest deleted
# first, in bounded batches). It bounds the database even when rows
# arrive faster than they age out — e.g. an anonymous-denial flood,
# which is always recorded. Hitting the cap logs a warning: evidence
# is being discarded ahead of schedule.
[audit]
retention_days = 365
sweep_interval_secs = 86400
max_rows = 1000000
