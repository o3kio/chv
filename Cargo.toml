[workspace]
members = [
    "cmd/chv-stord",
    "crates/chv-common",
    "crates/chv-errors",
    "crates/chv-observability",
    "crates/chv-config",
    "crates/chv-controlplane-types",
    "crates/chv-controlplane-store",
    "crates/chv-controlplane-service",
    "crates/chv-controlplane-seed",
    "crates/chv-stord-core",
    "crates/chv-stord-backends",
    "gen/rust/chv-stord-api",
    "cmd/chv-nwd",
    "crates/chv-nwd-core",
    "gen/rust/chv-nwd-api",
    "cmd/chv-agent",
    "cmd/chv-controlplane",
    "cmd/chv-monitor-agent",
    "crates/chv-agent-core",
    "crates/cellhv-core-types",
    "crates/cellhv-core-store",
    "crates/cellhv-nodecache-migration",
    "crates/cellhv-core-startup",
    "crates/cellhv-core-fs",
    "crates/cellhv-core-operations",
    "crates/cellhv-core-executor",
    "crates/cellhv-core-api",
    "crates/cellhv-core-runtime-owner",
    "crates/cellhv-core-runtime-ownership",
    "crates/cellhv-core-recovery",
    "crates/chv-agent-runtime-ch",
    "crates/chv-monitor-collectors",
    "crates/chv-monitoring-core",
    "crates/chv-monitoring-store",
    "crates/chv-hypervisor-api",
    "gen/rust/control-plane-node-api",
    "gen/rust/chv-webui-bff-api",
    "crates/chv-webui-bff",
    "crates/chv-architecture-validate",
    "crates/chv-architecture-reconcile",
    "crates/chv-netbox-adapter",
    "crates/chv-netbox-sim",
    "cmd/chvctl",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# tonic 0.14 split the old `tls` feature by crypto provider
# (`tls-ring` / `tls-aws-lc`) plus optional root stores
# (`tls-native-roots` / `tls-webpki-roots`, neither needed — every CHV
# TLS consumer loads its CA/cert material explicitly from PEM files).
# `tls-ring` keeps the ring provider the rest of the rustls stack uses
# (sqlx runtime-tokio-rustls, the stord migration mTLS listener).
#
# Feature set: transport + server + channel (hyper-based serving and
# clients), codegen (generated service traits; also what tonic-health
# requires), the ring TLS stack (which enables `tls-connect-info` — the
# CP's peer-identity extractor reads `TlsConnectInfo` from request
# extensions), and `router`. The last one is not optional for CHV:
# tonic 0.14 moved multi-service composition (`Server::add_service` →
# `Router`) onto axum, and every CHV gRPC server composes at least
# health + its main service through it. `router` therefore pulls axum
# 0.8 into the graph alongside the workspace's direct axum 0.7 — a
# duplicate that deny.toml's `deny-multiple-versions` gate would
# forbid; the known axum 0.8.9 is explicitly `skip`-listed there with
# a removal condition (the ruled separate axum 0.8 co-move PR, #235).
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    "server",
    "channel",
    "codegen",
    "router",
    "tls-ring",
] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.10"
hex = "0.4"
sha2 = "0.10"
metrics = "0.24"
# Snappy block compression for the Prometheus remote-write v1 export
# body (the protocol's required Content-Encoding).
snap = "1"
tokio-stream = "0.1"
dashmap = "6"
tempfile = "3"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs"] }
hyper-util = { version = "0.1", features = ["client", "server", "tokio"] }
metrics-exporter-prometheus = "0.18"
jsonwebtoken = "9"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
bcrypt = "0.19"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "derive", "json", "uuid", "chrono"] }
nix = { version = "0.31", features = ["term", "ioctl", "process", "fs"] }
crc32fast = "1"
moka = { version = "0.12", features = ["future"] }
aes-gcm = "0.11"
object_store = { version = "0.14", default-features = false, features = ["aws", "http"] }
# URL parsing/validation for operator-supplied endpoints (object_store
# panics on malformed S3 endpoints instead of returning an error, #677).
url = "2.5"
# Shared Kubedo stretched-L2 fabric provider (ADR-021), pinned to tag v0.1.5.
fabric-plan = { git = "https://github.com/o3kio/fabric", tag = "v0.1.5" }
fabric-linux = { git = "https://github.com/o3kio/fabric", tag = "v0.1.5" }
fabric-conformance = { git = "https://github.com/o3kio/fabric", tag = "v0.1.5" }
