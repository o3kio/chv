syntax = "proto3";

package chv.controlplane.node.v1;

message RequestMeta {
  string operation_id = 1;
  string requested_by = 2;
  string target_node_id = 3;
  // Monotonic decimal generation string issued by control plane.
  // Nodes reject non-numeric values and older generations.
  string desired_state_version = 4;
  int64 request_unix_ms = 5;
}

message ResultMeta {
  string operation_id = 1;
  string status = 2;
  // Last numeric generation accepted and observed by node for this resource.
  string node_observed_generation = 3;
  string error_code = 4;
  string human_summary = 5;
}

message NodeInventory {
  string node_id = 1;
  string hostname = 2;
  string architecture = 3;
  uint64 cpu_threads = 4;
  uint64 memory_bytes = 5;
  repeated string storage_classes = 6;
  repeated string network_capabilities = 7;
  map<string, string> labels = 8;
  repeated string hypervisor_capabilities = 9;
  string vtep_ip = 10; // VTEP IP address for overlay networking
  // Node's WireGuard public key for the stretched-L2 fabric (ADR-021),
  // reported best-effort from nwd's GetFabricIdentity RPC. Empty string
  // means the node has no fabric identity yet (nwd not up or fabric
  // disabled); the agent re-reports on the next inventory cycle.
  string wireguard_public_key = 11;
  // Measured default-route MTU of the node's underlay (0 = unmeasured),
  // used by the control plane to derive tenant/fabric MTUs.
  uint32 underlay_mtu = 12;
  // The node's authority mode — who owns lifecycle mutations on the node
  // (issue #378). Reported from the agent's local `authority_mode` config
  // (a static per-process fact) at enrollment and on every periodic
  // inventory cycle; the control plane persists it on the node's
  // inventory row. UNSPECIFIED means the agent has not reported a mode
  // (pre-field agents); consumers must fail OPEN on it — the agent's
  // fail-closed dispatch remains the enforcement boundary.
  AuthorityMode authority_mode = 13;
}

// Who owns lifecycle mutation authority on a node. Mirrors the agent
// config's kebab-case spellings (legacy / core-managed / core-native).
enum AuthorityMode {
  AUTHORITY_MODE_UNSPECIFIED = 0;
  AUTHORITY_MODE_LEGACY = 1;
  AUTHORITY_MODE_CORE_MANAGED = 2;
  AUTHORITY_MODE_CORE_NATIVE = 3;
}

message ServiceVersions {
  string node_id = 1;
  string chv_agent_version = 2;
  string chv_stord_version = 3;
  string chv_nwd_version = 4;
  string cloud_hypervisor_version = 5;
  string host_bundle_version = 6;
}

message EnrollmentRequest {
  string bootstrap_token = 1;
  NodeInventory inventory = 2;
  ServiceVersions versions = 3;
}

message EnrollmentResponse {
  ResultMeta result = 1;
  string issued_node_id = 2;
  bytes certificate_pem = 3;
  bytes private_key_pem = 4;
  bytes ca_pem = 5;
}

message RotateNodeCertificateRequest {
  RequestMeta meta = 1;
  string node_id = 2;
}

message RotateNodeCertificateResponse {
  ResultMeta result = 1;
  bytes certificate_pem = 2;
  bytes private_key_pem = 3;
  bytes ca_pem = 4;
}

message ReportBootstrapResultRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string bootstrap_status = 3;
  string message = 4;
}

message AckResponse {
  ResultMeta result = 1;
}

message ReportNodeInventoryRequest {
  RequestMeta meta = 1;
  NodeInventory inventory = 2;
}

message ReportServiceVersionsRequest {
  RequestMeta meta = 1;
  ServiceVersions versions = 2;
}

message DesiredStateFragment {
  string id = 1;
  string kind = 2;
  // Monotonic decimal generation string for this fragment.
  string generation = 3;
  bytes spec_json = 4;
  bytes policy_json = 5;
  string updated_at = 6;
  string updated_by = 7;
}

message ApplyNodeDesiredStateRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  DesiredStateFragment fragment = 3;
}

message ApplyVmDesiredStateRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  DesiredStateFragment fragment = 4;
}

message ApplyVolumeDesiredStateRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  DesiredStateFragment fragment = 4;
}

message ApplyNetworkDesiredStateRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
  DesiredStateFragment fragment = 4;
}

message StartNetworkRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
}

message StopNetworkRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
  bool force = 4;
}

message RestartNetworkRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
}

message AcknowledgeDesiredStateVersionRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string fragment_kind = 3;
  string fragment_id = 4;
  // Numeric generation string the node actually applied.
  string observed_generation = 5;
  string apply_status = 6;
}

message VmMutationSpec {
  string vm_id = 1;
  bytes vm_spec_json = 2;
}

message VolumeMutationSpec {
  string volume_id = 1;
  string vm_id = 2;
  bytes volume_spec_json = 3;
}

message CreateVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  VmMutationSpec vm = 3;
}

// #513 (DP2, PR 1 of the decomposition): the standalone volume-create
// dispatch carrier. Mirrors CreateVmRequest's shape (meta + node_id + a
// mutation spec whose JSON carries the provisioning intent): the volume's
// `volume_spec_json` is `{"size_bytes": N, "backend_class": C?}` — the
// size is REQUIRED (unlike the attach path's option-less open, the
// local/LVM create-on-open only provisions on a sized open), and the
// class key is the documented #511 wire-key seam (the CP-side store name
// is `storage_class`). The `vm_id` field of the embedded
// VolumeMutationSpec is unused on this surface (standalone volumes have
// no VM; DP4 defers attach-at-create). Dead-but-live with this PR: no
// producer dispatches it until the BFF route lands (PR 2).
message CreateVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  VolumeMutationSpec volume = 3;
}

// #522 (DP2, PR 1 of the decomposition): the standalone volume-delete
// dispatch carrier, the consumer of the stord `DestroyVolume`
// primitive (DP3). Mirrors DeleteVmRequest's shape (meta + node_id +
// the resource id) — no mutation spec, no size rides a delete; the
// volume's class resolves in the orchestrator's claim query like the
// attach arm's and rides `backend_class` so the agent can shape the
// DP4 carrier locator byte-identically to its create handler (the
// dm-path token for LVM, `{volume_id}.img` for local). Empty
// `backend_class` = local = the NULL-class discipline (never
// materialized as the string "local"). The agent handler closes any
// cached stord handle, destroys the backing store, and evicts its
// cache entry; it fails closed with `unimplemented` in core-managed
// mode (DP10, the #378/#495 single-writer posture). Dead-but-live
// with this PR: no producer journals a `DeleteVolume` operation until
// the BFF route lands (PR 2).
message DeleteVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  string backend_class = 4;
}

// #355 (design docs/design/issue-355-network-policy-dispatch.md, §3
// Option A, PR 1 of the decomposition): the network firewall-policy
// dispatch carrier. `policy_json` is the network's stored ruleset
// (`network_desired_state.firewall_rules_json`) verbatim; the agent
// handler applies it through nwd's existing `SetFirewallPolicy` — the
// same call the attach-time path makes — and nwd remains the
// fail-closed validator of the rule vocabulary. The generation rides
// `meta.desired_state_version` (the dispatch fence, DP7 — enforced in
// PR 3 of the decomposition). Mirrors DeleteVolumeRequest's shape
// (meta + node_id + the resource id + one payload field). Deliberately
// ACCEPTED in core-managed mode (the M2.2b carve-out the design rules
// on): policy application already runs behind the Core authority at
// VM attach (the core executor's set_firewall_policy call), the Core
// store models no network state to journal into, and the CP operations
// row is the journal. Dead-but-live with this PR: no producer journals
// an `UpdateNetworkPolicy` operation until the BFF route lands (PR 2).
message ApplyNetworkPolicyRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
  bytes policy_json = 4;
}

message StartVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
}

message StopVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  bool force = 4;
}

message RebootVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  bool force = 4;
}

message DeleteVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  bool force = 4;
}

message ResizeVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  optional uint32 desired_vcpus = 4;
  optional uint64 desired_memory_bytes = 5;
}

message PauseVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
}

message ResumeVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
}

message PowerButtonVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
}

message AddDiskRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string disk_path = 4;
  bool read_only = 5;
  string disk_id = 6;
}

message RemoveDeviceRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string device_id = 4;
}

message AddNetRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string tap_name = 4;
  string mac_address = 5;
  string net_id = 6;
}

message ResizeDiskRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string disk_id = 4;
  uint64 new_size_bytes = 5;
}

message SnapshotVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string destination = 4;
}

message RestoreSnapshotRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string source = 4;
}

message CoredumpVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string destination = 4;
}

message PingVmmRequest {
  string node_id = 1;
  string vm_id = 2;
}

message PingVmmResponse {
  bool alive = 1;
}

message AttachVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  VolumeMutationSpec volume = 3;
}

message DetachVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string volume_id = 4;
  bool force = 5;
}

message ResizeVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  uint64 new_size_bytes = 4;
}

message SnapshotVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  string snapshot_name = 4;
}

message RestoreVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  string snapshot_name = 4;
}

message DeleteVolumeSnapshotRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string volume_id = 3;
  string snapshot_name = 4;
}

message CloneVolumeRequest {
  RequestMeta meta = 1;
  string node_id = 2;
