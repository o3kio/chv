message NodeStateReport {
  string node_id = 1;
  string state = 2;
  string observed_generation = 3;
  string health_status = 4;
  string last_error = 5;
  int64 reported_unix_ms = 6;
}

message VmStateReport {
  string node_id = 1;
  string vm_id = 2;
  string runtime_status = 3;
  string observed_generation = 4;
  string health_status = 5;
  string last_error = 6;
  int64 reported_unix_ms = 7;

  // Optional runtime counters from CH /api/v1/vm.counters
  double cpu_percent = 8;
  int64 memory_bytes_used = 9;
  int64 memory_bytes_total = 10;
  int64 disk_bytes_read = 11;
  int64 disk_bytes_written = 12;
  int64 net_bytes_rx = 13;
  int64 net_bytes_tx = 14;
}

message VolumeStateReport {
  string node_id = 1;
  string volume_id = 2;
  string runtime_status = 3;
  string observed_generation = 4;
  string health_status = 5;
  string last_error = 6;
  int64 reported_unix_ms = 7;
}

message NetworkStateReport {
  string node_id = 1;
  string network_id = 2;
  string runtime_status = 3;
  string observed_generation = 4;
  string health_status = 5;
  string last_error = 6;
  int64 reported_unix_ms = 7;
}

message PublishEventRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string severity = 3;
  string event_type = 4;
  string summary = 5;
  bytes details_json = 6;
}

message PublishAlertRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string severity = 3;
  string alert_type = 4;
  string summary = 5;
  bytes details_json = 6;
}

service EnrollmentService {
  rpc EnrollNode(EnrollmentRequest) returns (EnrollmentResponse);
  rpc RotateNodeCertificate(RotateNodeCertificateRequest) returns (RotateNodeCertificateResponse);
  rpc ReportBootstrapResult(ReportBootstrapResultRequest) returns (AckResponse);
}

service InventoryService {
  rpc ReportNodeInventory(ReportNodeInventoryRequest) returns (AckResponse);
  rpc ReportServiceVersions(ReportServiceVersionsRequest) returns (AckResponse);
}

service ReconcileService {
  rpc ApplyNodeDesiredState(ApplyNodeDesiredStateRequest) returns (AckResponse);
  rpc ApplyVmDesiredState(ApplyVmDesiredStateRequest) returns (AckResponse);
  rpc ApplyVolumeDesiredState(ApplyVolumeDesiredStateRequest) returns (AckResponse);
  rpc ApplyNetworkDesiredState(ApplyNetworkDesiredStateRequest) returns (AckResponse);
  rpc AcknowledgeDesiredStateVersion(AcknowledgeDesiredStateVersionRequest) returns (AckResponse);
}

service LifecycleService {
  rpc CreateVm(CreateVmRequest) returns (AckResponse);
  // #513 (DP2, PR 1): standalone volume-create provisioning dispatch.
  // The handler opens the volume WITH the requested capacity
  // (create-on-open), not the attach path's option-less open, and fails
  // closed in core-managed mode like its sibling legacy volume RPCs.
  rpc CreateVolume(CreateVolumeRequest) returns (AckResponse);
  rpc DeleteVolume(DeleteVolumeRequest) returns (AckResponse);
  // #355 (PR 1 of the decomposition): network firewall-policy dispatch.
  // Accepted in core-managed mode (see ApplyNetworkPolicyRequest).
  rpc ApplyNetworkPolicy(ApplyNetworkPolicyRequest) returns (AckResponse);
  rpc StartVm(StartVmRequest) returns (AckResponse);
  rpc StopVm(StopVmRequest) returns (AckResponse);
  rpc RebootVm(RebootVmRequest) returns (AckResponse);
  rpc DeleteVm(DeleteVmRequest) returns (AckResponse);
  rpc ResizeVm(ResizeVmRequest) returns (AckResponse);
  rpc PauseVm(PauseVmRequest) returns (AckResponse);
  rpc ResumeVm(ResumeVmRequest) returns (AckResponse);
  rpc PowerButtonVm(PowerButtonVmRequest) returns (AckResponse);
  rpc AttachVolume(AttachVolumeRequest) returns (AckResponse);
  rpc DetachVolume(DetachVolumeRequest) returns (AckResponse);
  rpc ResizeVolume(ResizeVolumeRequest) returns (AckResponse);
  rpc SnapshotVolume(SnapshotVolumeRequest) returns (AckResponse);
  rpc RestoreVolume(RestoreVolumeRequest) returns (AckResponse);
  rpc DeleteVolumeSnapshot(DeleteVolumeSnapshotRequest) returns (AckResponse);
  rpc CloneVolume(CloneVolumeRequest) returns (AckResponse);
  rpc AddDisk(AddDiskRequest) returns (AckResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (AckResponse);
  rpc AddNet(AddNetRequest) returns (AckResponse);
  rpc ResizeDisk(ResizeDiskRequest) returns (AckResponse);
  rpc SnapshotVm(SnapshotVmRequest) returns (AckResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (AckResponse);
  rpc CoredumpVm(CoredumpVmRequest) returns (AckResponse);
  rpc PingVmm(PingVmmRequest) returns (PingVmmResponse);
  rpc PauseNodeScheduling(PauseNodeSchedulingRequest) returns (AckResponse);
  rpc ResumeNodeScheduling(ResumeNodeSchedulingRequest) returns (AckResponse);
  rpc DrainNode(DrainNodeRequest) returns (AckResponse);
  rpc EnterMaintenance(EnterMaintenanceRequest) returns (AckResponse);
  rpc ExitMaintenance(ExitMaintenanceRequest) returns (AckResponse);
  rpc StartNetwork(StartNetworkRequest) returns (AckResponse);
  rpc StopNetwork(StopNetworkRequest) returns (AckResponse);
  rpc RestartNetwork(RestartNetworkRequest) returns (AckResponse);
  rpc MigrateVm(MigrateVmRequest) returns (AckResponse);
  rpc UpdateOverlay(UpdateOverlayRequest) returns (AckResponse);
  rpc SendGratuitousArp(SendGratuitousArpRequest) returns (AckResponse);
  // Operator egress for restart-interrupted (InspectRequired) operations.
  // Core-managed nodes only: the resolution terminal-persists the operation
  // in the core journal after explicit inspection. `operation_id` identifies
  // the journal operation to resolve (see Core API /v1/operations): stuck
  // operations are status `running` with a `recovery_assessment` field;
  // `running` without it is in flight in the live process.
  rpc ResolveInspectRequiredOperation(ResolveInspectRequiredOperationRequest)
    returns (AckResponse);
}

service TelemetryService {
  rpc ReportNodeState(NodeStateReport) returns (AckResponse);
  rpc ReportVmState(VmStateReport) returns (AckResponse);
  rpc ReportVolumeState(VolumeStateReport) returns (AckResponse);
  rpc ReportNetworkState(NetworkStateReport) returns (AckResponse);
  rpc PublishEvent(PublishEventRequest) returns (AckResponse);
  rpc PublishAlert(PublishAlertRequest) returns (AckResponse);
  rpc ReportMigrationProgress(MigrationProgress) returns (AckResponse);
}

// Native monitoring ingestion v1 (#602, ADR-025/027, ingestion contract
// docs/specs/contracts/chv-monitoring-ingestion-v1.md). Served on the
// same mTLS node channel as TelemetryService; the peer certificate
// identifies the sender and every sample's target must be owned by that
// node. Delivery is at-least-once: batches are deduplicated durably by
// (authenticated sender, boot_id, sequence); the same triple with a
// different body is a replay_conflict. An acknowledgment means the batch
// is durably committed to the monitoring store, never an in-memory
// enqueue. Ingestion is observational only — a rejected or dropped batch
// can never mutate VM or node state.
service MonitoringService {
  rpc IngestNodeMetricBatch(NodeMetricBatchRequest) returns (NodeMetricBatchResponse);
}

// One sample in the v1 metric contract's model
// (crates/chv-monitoring-core/src/model.rs is the normative Rust shape).
message MetricSampleV1 {
  // node | vm | volume | network | check
  string target_kind = 1;
  string target_id = 2;
  // Registry metric id (validated against the v1 allowlist).
  string metric_id = 3;
  // node_os | vmm | vm_cgroup | storage_provider | network_provider |
  // guest_agent | derived — attributed only to the layer that observed it.
  string source = 4;
  // gauge | counter | state
  string kind = 5;
  // ratio | cores | bytes | bytes_per_second | seconds | count |
  // operations | celsius | boolean
  string unit = 6;
  int64 observed_at_ms = 7;
  // Exactly one form is set when quality == "valid"; both are absent for
  // any non-valid quality (missing data is never encoded as zero).
  // Counters are exact uint64 on this transport; the BFF JSON wire
  // encodes values above 2^53-1 as decimal strings.
  oneof value {
    double float_value = 8;
    uint64 integer_value = 9;
  }
  // valid | insufficient_samples | unsupported | unavailable | invalid | stale
  string quality = 10;
  // Bounded dimension set (registry-validated keys; e.g. interface_id).
  map<string, string> dimensions = 11;
  // Counter-epoch fencing: identifies the restartable source so a reset
  // can never be subtracted as a delta. Empty for series without a
  // restartable counter source.
  string boot_id = 12;
  string identity_epoch = 13;
}

message NodeMetricBatchRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  // Must be 1.
  int32 schema_version = 3;
  // Sender epoch for the dedup key: a per-agent-run identifier (a fresh
  // value on agent start), NOT the host boot id — a restarted agent must
  // never collide with its previous incarnation's sequences.
  string boot_id = 4;
  // Monotonic within (sender, boot_id); starts at 0 in each run.
  uint64 sequence = 5;
  int64 sent_at_ms = 6;
  repeated MetricSampleV1 samples = 7;
}

message NodeMetricBatchResponse {
  ResultMeta meta = 1;
  // accepted | duplicate | replay_conflict | invalid_batch |
  // batch_too_large | unsupported_metric | rate_limited |
  // ingestion_unavailable
  string outcome = 2;
  // Samples durably committed (0 for every non-accepted outcome).
  uint32 accepted_samples = 3;
  // Correlation id for operator debugging.
  string request_id = 4;
  // Bounded retry hint; 0 unless outcome == "rate_limited".
  uint32 retry_after_seconds = 5;
}

message MigrateVmRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string vm_id = 3;
  string source_node_id = 4;
  string destination_node_id = 5;
  MigrationConfig config = 6;
}

message MigrationConfig {
  uint32 dirty_threshold_blocks = 1;  // default: 1024
  uint32 max_convergence_rounds = 2;  // default: 10
  uint32 block_size_bytes = 3;        // default: 4194304 (4MB)
  uint32 total_timeout_seconds = 4;   // 0 = use calculated default
  // Issue #394 Option C: opt-in stop-the-world disk migration — the agent
  // pauses the VM before triggering stord's bulk copy (the
  // PAUSED_PRE_COPY handshake) instead of only at final sync. Downtime
  // equals the full disk+memory transfer; correctness by construction.
  bool pause_first = 5;
}

message MigrationProgress {
  string vm_id = 1;
  string operation_id = 2;
  MigrationPhase phase = 3;
  uint64 bytes_transferred = 4;
  uint64 total_bytes = 5;
  uint32 convergence_round = 6;
  uint64 dirty_blocks_remaining = 7;
  float progress_percent = 8;
  // Identity of the agent reporting progress. Pinned to the mTLS peer
  // certificate by the control plane so a compromised node cannot update
  // another node's migration row.
  string node_id = 9;
}

enum MigrationPhase {
  MIGRATION_PHASE_UNSPECIFIED = 0;
  MIGRATION_PHASE_PENDING = 1;
  MIGRATION_PHASE_PRECOPY_DISK = 2;
  MIGRATION_PHASE_CONVERGING_DISK = 3;
  MIGRATION_PHASE_MEMORY_MIGRATION = 4;
  MIGRATION_PHASE_PAUSED = 5;
  MIGRATION_PHASE_COMPLETED = 6;
  MIGRATION_PHASE_FAILED = 7;
  MIGRATION_PHASE_ROLLED_BACK = 8;
}

// ---------------------------------------------------------------------------
// Overlay management (CP → Agent → NWD)
// ---------------------------------------------------------------------------

message VtepEndpoint {
  string node_id = 1;
  string vtep_ip = 2;
  uint32 vtep_port = 3;
}

message FdbEntry {
  string mac_address = 1;
  string vtep_ip = 2;
}

message UpdateOverlayRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
  uint32 vni = 4;
  // Deprecated: legacy pre-ADR-021 datapath, ignored by nwd.
  repeated VtepEndpoint vtep_endpoints = 5;
  // Deprecated: legacy pre-ADR-021 datapath, ignored by nwd. nwd rejects a
  // fabric-less UpdateOverlay in-band (ADR-021 retired the FDB datapath).
  repeated FdbEntry fdb_entries = 6;
  // Stretched-L2 fabric plan (ADR-021); takes the fabric path in nwd when set.
  FabricPlan fabric = 7;
}

// ---------------------------------------------------------------------------
// Stretched-L2 fabric (ADR-021) — mirrors chv-nwd-api FabricPeer/FabricPlan
// ---------------------------------------------------------------------------

message FabricPeer {
  string node_id = 1;
  string public_key = 2;        // WireGuard public key (base64, 44 chars)
  string underlay_endpoint = 3; // host:port of the peer's WireGuard listener
  string fabric_ip = 4;         // peer transport IP inside the fabric mesh
}

message FabricPlan {
  string fabric_domain_id = 1;
  string local_host_id = 2;
  string local_fabric_ip = 3;
  uint32 tenant_mtu = 4;   // 0 = daemon default
  uint32 fabric_mtu = 5;   // 0 = daemon default
  uint64 binding_generation = 6;
  uint64 plan_generation = 7;
  repeated FabricPeer peers = 8; // bounded head-end replication set
}

message SendGratuitousArpRequest {
  RequestMeta meta = 1;
  string node_id = 2;
  string network_id = 3;
  string vm_ip = 4;
  string bridge_name = 5;
}

message ResolveInspectRequiredOperationRequest {
  RequestMeta meta = 1;
  // Informational context for the audit record; `operation_id` is the
  // authoritative key and is discovered via Core API /v1/operations.
  string vm_id = 2;
  string operation_id = 3;
  // Terminal outcome of the operator inspection: "succeeded" or "failed".
  string disposition = 4;
  // Required operator inspection evidence recorded in the journal.
  string note = 5;
}
