syntax = "proto3";

package chv.node.stord.v1;

message Meta {
  string operation_id = 1;
  int64 request_unix_ms = 2;
}

message Result {
  string status = 1;
  string error_code = 2;
  string human_summary = 3;
}

message DevicePolicy {
  uint64 read_bps = 1;
  uint64 write_bps = 2;
  uint64 read_iops = 3;
  uint64 write_iops = 4;
  bool burst_allowed = 5;
  bool read_only = 6;
  bool no_exec = 7;
  string io_scheduler = 8;
  string cache_mode = 9;
}

message BackendLocator {
  string backend_class = 1;
  string locator = 2;
  map<string, string> options = 3;
}

message OpenVolumeRequest {
  Meta meta = 1;
  string volume_id = 2;
  BackendLocator backend = 3;
  DevicePolicy policy = 4;
}

message OpenVolumeResponse {
  Result result = 1;
  string volume_id = 2;
  string attachment_handle = 3;
  string export_kind = 4;
  string export_path = 5;
}

message CloseVolumeRequest {
  Meta meta = 1;
  string volume_id = 2;
  string attachment_handle = 3;
}

message AttachVolumeToVmRequest {
  Meta meta = 1;
  string volume_id = 2;
  string vm_id = 3;
  string attachment_handle = 4;
}

message AttachVolumeToVmResponse {
  Result result = 1;
  string volume_id = 2;
  string vm_id = 3;
  string export_kind = 4;
  string export_path = 5;
}

message DetachVolumeFromVmRequest {
  Meta meta = 1;
  string volume_id = 2;
  string vm_id = 3;
  bool force = 4;
}

message ResizeVolumeRequest {
  Meta meta = 1;
  string volume_id = 2;
  uint64 new_size_bytes = 3;
}

message PrepareSnapshotRequest {
  Meta meta = 1;
  string volume_id = 2;
  string snapshot_name = 3;
}

message PrepareCloneRequest {
  Meta meta = 1;
  string volume_id = 2;
  string clone_name = 3;
}

message RestoreSnapshotRequest {
  Meta meta = 1;
  string volume_id = 2;
  string snapshot_name = 3;
}

message DeleteSnapshotRequest {
  Meta meta = 1;
  string volume_id = 2;
  string snapshot_name = 3;
}

// #522 (DP3, PR 1 of the decomposition): the physical reclaim primitive
// — the first data-destroying RPC in the stord API. Destroys the
// volume's backing store at the CARRIER locator (the create/open
// carrier's locator, DP4: `{volume_id}.img` relative under stord's
// runtime dir for local, the `/dev/mapper/{vg}-{vid}` dm-path token
// for LVM — never the attach path's stray bare-id file, tracked in
// #533). IDEMPOTENT BY CONTRACT: destroying a volume whose backing
// store is already gone is a SUCCESS (`ok`), never an error — PR 2's
// accept-time story (crash-redrive, operator retry, a create dispatch
// that never landed) depends on a replayed delete not failing on the
// absent artifact. The handler REFUSES while any open session exists
// for the volume (close first — the agent's DeleteVolume node RPC is
// the cooperative close-then-destroy caller). Per-backend semantics:
// local unlinks if present; LVM `lvremove -y` if the LV exists; the
// iscsi/ceph classes refuse loudly (they are unqualified even at
// open, #379 §8). Dead-but-live with this PR: no producer calls it
// until the BFF route lands (PR 2).
message DestroyVolumeRequest {
  Meta meta = 1;
  string volume_id = 2;
  BackendLocator backend = 3;
}

message SetDevicePolicyRequest {
  Meta meta = 1;
  string volume_id = 2;
  DevicePolicy policy = 3;
}

message VolumeHealthRequest {
  string volume_id = 1;
}

message VolumeHealthResponse {
  Result result = 1;
  string volume_id = 2;
  string health_status = 3;
  string backend_state = 4;
  string last_error = 5;
}

message VolumeSession {
  string volume_id = 1;
  string vm_id = 2;
  string attachment_handle = 3;
  string export_kind = 4;
  string export_path = 5;
  string runtime_status = 6;
}

message ListVolumeSessionsRequest {}

message ListVolumeSessionsResponse {
  repeated VolumeSession sessions = 1;
}

message TriggerDiskMigrationRequest {
  Meta meta = 1;
  string volume_id = 2;
  string attachment_handle = 3;
  string dest_endpoint = 4;
  // Issue #394 Option C: opt-in stop-the-world mode. When true, stord
  // requests the VM pause BEFORE reading any source byte (the
  // PAUSED_PRE_COPY status phase) and the whole transfer runs against a
  // quiescent source — correct by construction for any write pattern, at
  // the cost of downtime equal to the transfer time. Default false keeps
  // the quiescent-assumed contract (write canary + finalize digest).
  bool pause_first = 5;
  // Control-plane-issued migration authorization minted for this exact
  // source node, destination node, volume, and size (issue #663). stord
  // forwards it verbatim to the destination's InitMigration; the source
  // does not verify it.
  string migration_authorization = 6;
}

message TriggerDiskMigrationResponse {
  Result result = 1;
  string migration_id = 2;
  // Issue #582 (T=0 skew guard): stord echoes back the `pause_first`
  // mode it will actually run. An older stord that predates the field
  // drops the unknown request field (proto3) and leaves this at false
  // — so a requester that asked for pause-first can fail closed at
  // trigger time instead of silently migrating against an unpaused
  // VM. Echoes the request value verbatim; not a status report.
  bool pause_first = 3;
}

message GetDiskMigrationStatusRequest {
  string migration_id = 1;
}

message GetDiskMigrationStatusResponse {
  Result result = 1;
  enum Phase {
    PENDING = 0;
    BULK_COPY = 1;
    DIRTY_SYNC = 2;
    PAUSED_FINAL_SYNC = 3;
    COMPLETED = 4;
    FAILED = 5;
    // Issue #394 Option C: pause-first mode — the task is waiting for the
    // VM pause BEFORE bulk copy (no bytes transferred yet).
    PAUSED_PRE_COPY = 6;
  }
  Phase phase = 2;
  uint32 convergence_round = 3;
  uint64 dirty_blocks_remaining = 4;
  uint64 bytes_transferred = 5;
  uint64 total_bytes = 6;
  bool needs_vm_pause = 7;
  string error_message = 8;
}

message ResumeDiskMigrationRequest {
  string migration_id = 1;
  bool vm_paused = 2;
}

message ResumeDiskMigrationResponse {
  Result result = 1;
}

service StorageService {
  rpc OpenVolume(OpenVolumeRequest) returns (OpenVolumeResponse);
  rpc CloseVolume(CloseVolumeRequest) returns (Result);
  rpc AttachVolumeToVm(AttachVolumeToVmRequest) returns (AttachVolumeToVmResponse);
  rpc DetachVolumeFromVm(DetachVolumeFromVmRequest) returns (Result);
  rpc ResizeVolume(ResizeVolumeRequest) returns (Result);
  rpc PrepareSnapshot(PrepareSnapshotRequest) returns (Result);
  rpc PrepareClone(PrepareCloneRequest) returns (Result);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (Result);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (Result);
  rpc DestroyVolume(DestroyVolumeRequest) returns (Result);
  rpc SetDevicePolicy(SetDevicePolicyRequest) returns (Result);
  rpc GetVolumeHealth(VolumeHealthRequest) returns (VolumeHealthResponse);
  rpc ListVolumeSessions(ListVolumeSessionsRequest) returns (ListVolumeSessionsResponse);
  rpc TriggerDiskMigration(TriggerDiskMigrationRequest) returns (TriggerDiskMigrationResponse);
  rpc GetDiskMigrationStatus(GetDiskMigrationStatusRequest) returns (GetDiskMigrationStatusResponse);
  rpc ResumeDiskMigration(ResumeDiskMigrationRequest) returns (ResumeDiskMigrationResponse);
}
